
name: testes-e-publicacao

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes
        run: python -m pytest -v

      - name: Gerar relatorio HTML
        run: |
          python -m relatorio dados/vendas.csv --saida relatorio.html

      - name: Preparar pasta para publicacao
        run: |
          mkdir publicacao
          cp relatorio.html publicacao/index.html

      - name: Enviar artefato para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: publicacao

  deploy:
    needs: pytest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
